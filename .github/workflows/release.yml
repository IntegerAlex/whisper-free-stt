name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.resolve.outputs.release_id }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || '' }}
          fetch-depth: 0
      - name: Resolve release ID
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.id' 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(gh api repos/${{ github.repository }}/releases -f tag_name="$TAG" -f name="$TAG" --jq '.id')
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build & Release
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-13
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install frontend dependencies
        working-directory: stt-ui
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stt-ui/src-tauri

      - name: Setup Python (for sidecar build)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5"

      - name: Install appimagetool (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          # Extract instead of running (FUSE not available on CI)
          /tmp/appimagetool --appimage-extract > /dev/null 2>&1 || true
          sudo cp /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build sidecar
        working-directory: stt-ui
        run: bash scripts/build-sidecar.sh
        if: matrix.platform == 'ubuntu-22.04'

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: stt-ui
          releaseId: ${{ needs.resolve-release.outputs.release_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floure-${{ matrix.platform }}
          path: |
            stt-ui/src-tauri/target/release/bundle/**/*.dmg
            stt-ui/src-tauri/target/release/bundle/**/*.exe
            stt-ui/src-tauri/target/release/bundle/**/*.AppImage
            stt-ui/src-tauri/target/release/bundle/**/*.deb
            stt-ui/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: warn
